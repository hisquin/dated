<header><div class="w hd"><a class="wm" href="#discover">inyungu</a><nav class="tp" id="tn" aria-label="Primary"></nav><div class="gs" id="gs"><input id="gq" type="search" role="combobox" aria-expanded="false" aria-controls="gr" autocomplete="off" placeholder="Search businesses, brands, offers" aria-label="Search the whole site"><div id="gr" class="gr" role="listbox" hidden></div></div><a class="btn hcta" href="#business">List your business</a></div></header>

const $=s=>document.querySelector(s),live=o=>!o.exp||o.exp>=T,esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
