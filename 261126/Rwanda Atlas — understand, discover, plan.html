<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rwanda Atlas — understand, discover, plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--ink:#1d211c;--mute:#5d6358;--line:#d6cfc0;--acc:#a8472a;--soft:#ebe4d5;--ok:#2f6b45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14170f;--ink:#ece6d8;--mute:#a4a898;--line:#33382c;--acc:#e08a63;--soft:#1d2117;--ok:#7fc395}}
:root[data-theme="dark"]{--bg:#14170f;--ink:#ece6d8;--mute:#a4a898;--line:#33382c;--acc:#e08a63;--soft:#1d2117;--ok:#7fc395}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:400;line-height:1.15;margin:0}
a{color:inherit}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1100px;margin:auto;padding:12px 20px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{font-family:Fraunces,Georgia,serif;font-size:20px;text-decoration:none;font-weight:600}
.logo span{color:var(--acc)}
nav{display:flex;gap:16px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--mute);font-size:14px;padding:4px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{color:var(--ink);border-color:var(--acc)}
.search{margin-left:auto;flex:1;min-width:180px;max-width:300px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:8px 12px;border:1px solid var(--line);background:var(--soft);border-radius:2px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:0 20px 80px}
.hero{padding:56px 0 40px;border-bottom:1px solid var(--line);position:relative}
.hero h1{font-size:clamp(34px,6vw,64px);max-width:15ch}
.hero p{max-width:52ch;color:var(--mute);font-size:18px}
.contours{position:absolute;right:0;top:20px;width:min(42%,380px);opacity:.5;pointer-events:none}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));border-bottom:1px solid var(--line)}
.pillars div{padding:28px 24px 28px 0}
.pillars b{display:block;font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:400}
.sec{padding:40px 0;border-bottom:1px solid var(--line)}
.sec>h2{font-size:28px;margin-bottom:6px}
.sub{color:var(--mute);margin:0 0 22px}
.list a.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px 0;border-top:1px solid var(--line);text-decoration:none;align-items:baseline}
.list a.row:hover h3{color:var(--acc)}
.list .n{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.list h3{font-size:22px}
.tag{font-size:12px;border:1px solid var(--line);padding:1px 8px;border-radius:20px;color:var(--mute);white-space:nowrap}
.unv{color:var(--mute);font-style:italic;font-size:14px}
.unv:before{content:"◌ "}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.filters select{width:auto;min-width:150px}
.map{border:1px solid var(--line);background:var(--soft);min-height:200px;display:grid;place-items:center;text-align:center;padding:24px;margin:18px 0;color:var(--mute)}
.notice{border-left:3px solid var(--acc);background:var(--soft);padding:10px 14px;font-size:14px;margin:18px 0}
.dgrid{display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:800px){.dgrid{grid-template-columns:200px 1fr;gap:40px}}
.dgrid aside{font-size:14px;color:var(--mute)}
.dsec{padding:22px 0;border-top:1px solid var(--line)}
.dsec h2{font-size:21px;margin-bottom:6px}
.crumb{font-size:13px;color:var(--mute);padding:20px 0 0}
.crumb a{color:var(--mute)}
.ph{aspect-ratio:21/8;background:repeating-linear-gradient(135deg,var(--soft) 0 12px,var(--bg) 12px 24px);border:1px solid var(--line);display:grid;place-items:center;color:var(--mute);font-size:13px;margin:18px 0}
button{cursor:pointer;background:var(--ink);color:var(--bg);border:0;padding:8px 14px;border-radius:2px}
button.g{background:none;color:var(--ink);border:1px solid var(--line)}
form.ed{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.st{color:var(--ok);font-weight:600;font-size:13px}
footer{max-width:1100px;margin:auto;padding:24px 20px 60px;color:var(--mute);font-size:13px}
:root{--bg:#eee8da;--ink:#16221b;--mute:#58604f;--line:#c9c1ad;--soft:#e5ddca;--acc:#a9421f}
.contours{display:none}
header{border-bottom:1px solid var(--ink)}
.bar{padding:14px 20px}
.logo{font-size:19px;letter-spacing:-.01em}
nav a{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:500;border-bottom-width:1px}
.search{border:0;border-bottom:1px solid var(--ink);background:none;border-radius:0;padding:6px 0}
.hero{padding:72px 0 56px;border-bottom:1px solid var(--ink);overflow:hidden}
.hero h1{font-size:clamp(42px,9vw,112px);letter-spacing:-.035em;line-height:.95;max-width:11ch;position:relative;z-index:1}
.hero h1 em{color:var(--acc);font-style:italic}
.hero p{position:relative;z-index:1;margin-top:28px;font-size:19px;max-width:44ch;color:var(--ink)}
.hero .eyebrow{margin-bottom:22px;display:flex;gap:12px;align-items:center}
.hero .eyebrow:after{content:"";height:1px;background:var(--ink);width:60px}
.topo{position:absolute;right:-6%;top:-4%;width:min(78%,640px);color:var(--ink);opacity:.2;pointer-events:none}
.topo path{fill:none;stroke:currentColor;stroke-width:.8}
.topo path:nth-child(5n){stroke-width:1.6;stroke:var(--acc)}
.pillars{border-bottom:1px solid var(--ink)}
.pillars div{padding:26px 28px 30px 0;border-right:1px solid var(--line);margin-right:28px;font-size:15px;color:var(--mute)}
.pillars div:last-child{border:0}
.pillars b{font-size:30px;letter-spacing:-.02em;color:var(--ink);margin-bottom:6px}
.sec{border-bottom:1px solid var(--ink);padding:48px 0}
.sec>h2{font-size:clamp(28px,4vw,44px);letter-spacing:-.02em;margin-bottom:8px}
.eyebrow{font-weight:500;font-size:11px;letter-spacing:.18em;margin-bottom:10px}
.list a.row{grid-template-columns:56px 1fr auto;padding:20px 0;transition:padding-left .2s}
.list a.row:hover{padding-left:10px}
.list a.row:hover h3{color:var(--acc)}
.list .n{font-family:Fraunces,Georgia,serif;font-size:20px;color:var(--acc)}
.list h3{font-size:clamp(22px,3vw,32px);letter-spacing:-.015em}
.tag{border-radius:0;font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:3px 7px}
.regs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-top:1px solid var(--ink)}
.regs a.row{display:block;padding:22px 20px 26px 0;border-top:0;border-right:1px solid var(--line);margin-right:20px;min-height:190px;position:relative}
.regs a.row:last-child{border-right:0}
.regs .n{display:block;font-size:64px;line-height:1;color:var(--ink);opacity:.9;margin-bottom:34px}
.regs a.row:hover{padding-left:0}
.regs a.row:hover .n{color:var(--acc)}
.regs h3{font-size:24px}
.regs .tag{position:absolute;right:20px;top:26px}
.notice{border:1px dashed var(--mute);background:none;padding:12px 16px}
.map{border:1px solid var(--ink);background:repeating-linear-gradient(0deg,transparent 0 31px,var(--line) 31px 32px),repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px)}
select{border-radius:0;background:none;border-color:var(--ink)}
button{border-radius:0;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600}
.plate{position:relative;aspect-ratio:21/8;min-height:150px;margin:22px 0;border:1px solid var(--ink);background:var(--soft);overflow:hidden}
.plate .topo{opacity:.35;right:-8%;top:-30%;width:70%}
.plate span{position:absolute;left:14px;bottom:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dgrid{grid-template-columns:1fr!important;gap:0!important}
.dgrid aside{order:-1;columns:3 150px;column-gap:28px;padding:14px 0;border-block:1px solid var(--ink);margin-bottom:6px}
.dsec{display:grid;grid-template-columns:1fr;gap:6px;padding:26px 0}
@media(min-width:800px){.dsec{grid-template-columns:230px 1fr;gap:30px}}
.dsec h2{font-family:Inter,system-ui,sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--acc);margin:4px 0 0}
.crumb{font-size:11px;text-transform:uppercase;letter-spacing:.12em}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home">Rwanda<span> Atlas</span></a>
<nav id="nav"></nav>
<input class="search" id="q" type="search" placeholder="Search places, regions, stories…" aria-label="Global search">
</div></header>
<main id="app"></main>
<footer>Temporary wordmark; final identity pending. Independent platform — not a tour operator, booking engine or tourism authority. Nothing here is official travel guidance.</footer>
<script>
const U='Information not yet verified';
const NAV=[['explore','Explore'],['stories','Stories'],['knowledge','Knowledge'],['plan','Plan a Visit'],['about','About']];
const REG=[
{id:'kigali',name:'Kigali',note:'The capital city and its surroundings.'},
{id:'north',name:'Musanze & Northern Rwanda',note:'Northern highlands and volcano region.'},
{id:'kivu',name:'Lake Kivu region',note:'Communities and landscapes along Lake Kivu.'},
{id:'south',name:'Nyungwe & Southern Rwanda',note:'Southern and south-western Rwanda.'}];
/* Record shape: coords:[lat,lng] only when verified. Nothing below is verified content: these are named stubs awaiting editorial work. */
let DEST=[
{id:'kigali',name:'Kigali',region:'kigali',type:'City & community'},
{id:'kigali-genocide-memorial',name:'Kigali Genocide Memorial',region:'kigali',type:'Culture & heritage'},
{id:'volcanoes-national-park',name:'Volcanoes National Park',region:'north',type:'Nature & conservation'},
{id:'musanze',name:'Musanze',region:'north',type:'City & community'},
{id:'lake-burera',name:'Lake Burera',region:'north',type:'Lakes & landscapes'},
{id:'lake-kivu',name:'Lake Kivu',region:'kivu',type:'Lakes & landscapes'},
{id:'nyungwe-national-park',name:'Nyungwe National Park',region:'south',type:'Nature & conservation'},
{id:'huye',name:'Huye',region:'south',type:'City & community'}
].map(d=>({status:'Published',stub:true,sources:[],verified:'',...d}));
const STAGES=['Draft','Editorial review','Verification','Published'];
const SECTIONS=['Geographic context','Why it matters','History, cultural or environmental context','Things to discover','Experiences and activities','Nearby places','Practical visitor information','Accommodation options','Tour operators and guides','Official or authorised links'];
const TYPES=[...new Set(DEST.map(d=>d.type))];
/* Decorative topographic lines, generated: not real terrain and not geographic data. */
function contours(seed,cx,cy){
 let p='';
 for(let k=1;k<=16;k++){let d='';
  for(let i=0;i<=72;i++){const a=i/72*Math.PI*2,r=k*13+7*Math.sin(3*a+seed+k*.25)+5*Math.sin(5*a-seed*1.3-k*.4)+3*Math.cos(2*a+k*.15);
   d+=(i?'L':'M')+(cx+r*Math.cos(a)*1.15).toFixed(1)+' '+(cy+r*Math.sin(a)*.9).toFixed(1)}
  p+='<path d="'+d+'Z"/>'}
 return '<svg class="topo" viewBox="0 0 400 400" aria-hidden="true">'+p+'</svg>';
}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const reg=id=>REG.find(r=>r.id===id)||{name:''};
let S={q:'',r:'',t:''};
const live=()=>DEST.filter(d=>d.status==='Published');
function rows(list){
 if(!list.length)return '<p class="unv">No matching records. Try a different search or filter.</p>';
 return '<div class="list">'+list.map((d,i)=>`<a class="row" href="#d-${d.id}"><span class="n">${String(i+1).padStart(2,'0')}</span><div><h3>${esc(d.name)}</h3><span class="unv">${d.stub?'Stub profile — editorial content pending':'Verified '+esc(d.verified)}</span></div><span><span class="tag">${esc(reg(d.region).name)}</span> <span class="tag">${esc(d.type)}</span></span></a>`).join('')+'</div>';
}
function mapBox(list){
 const pts=list.filter(d=>Array.isArray(d.coords));
 if(!pts.length)return `<div class="map"><div><b class="serif">Map ready, no markers yet</b><br>Markers appear only for destinations with verified coordinates.<br>${list.length} destination(s) are listed without coordinates.</div></div>`;
 return `<div class="map">${pts.length} verified location(s). Map tiles connect here.</div>`;
}
function filtered(){
 const q=S.q.toLowerCase();
 return live().filter(d=>(!S.r||d.region===S.r)&&(!S.t||d.type===S.t)&&(!q||(d.name+' '+reg(d.region).name+' '+d.type).toLowerCase().includes(q)));
}
const V={
home(){return `
<section class="hero"><svg class="contours" viewBox="0 0 300 300" fill="none" stroke="currentColor" stroke-width="1" style="color:var(--acc)" aria-hidden="true"><path d="M20 160c20-90 120-130 190-80s60 140-20 170S0 250 20 160z"/><path d="M50 160c15-65 90-95 140-55s45 105-15 125S35 225 50 160z"/><path d="M80 160c10-40 60-60 90-35s28 70-10 80S70 190 80 160z"/><path d="M108 158c5-18 28-27 40-14s12 32-5 36-39-4-35-22z"/></svg>
<div class="eyebrow">Knowledge · Discovery · Travel</div>
<h1>Understand Rwanda before you set out to <em>find&nbsp;it.</em></h1>${contours(7,200,200,1)}
<p>A curated reference to places, history and practical visiting, built around the place itself, not the business next door.</p></section>
<div class="pillars"><div><b>Understand</b>Geography, history, heritage, communities and conservation.</div><div><b>Find</b>Destinations, regions and experiences, mapped and connected.</div><div><b>Experience</b>Practical visitor information and routes to official booking channels.</div></div>
<section class="sec"><h2>Regional collections</h2><p class="sub">Four starting regions; Rwanda is far larger than this first selection.</p><div class="regs">${REG.map((r,i)=>`<a class="row" href="#explore" data-r="${r.id}"><span class="n">0${i+1}</span><div><h3>${r.name}</h3><span class="unv">${r.note}</span></div><span class="tag">${DEST.filter(d=>d.region===r.id).length} places</span></a>`).join('')}</div></section>
<section class="sec"><h2>Places to begin</h2><p class="sub">Named stubs awaiting verified editorial content.</p>${rows(live().slice(0,5))}</section>
<section class="sec"><h2>Stories & knowledge</h2><p class="sub">No stories are published yet.</p><div class="notice">Stories and knowledge articles enter through the editorial workflow (Draft → Editorial review → Verification → Published) and are never auto-published.</div></section>`},
explore(){const l=filtered();return `<section class="sec"><div class="eyebrow">Explore</div><h2>Destinations</h2>
<div class="filters"><select id="fr" aria-label="Region"><option value="">All regions</option>${REG.map(r=>`<option value="${r.id}" ${S.r===r.id?'selected':''}>${r.name}</option>`).join('')}</select>
<select id="ft" aria-label="Category"><option value="">All categories</option>${TYPES.map(t=>`<option ${S.t===t?'selected':''}>${t}</option>`).join('')}</select></div>
${mapBox(l)}${rows(l)}</section>`},
stories(){return `<section class="sec"><div class="eyebrow">Stories</div><h2>Editorial stories</h2><p class="sub">Cultural stories, history, people and communities, conservation, local experiences and regional guides.</p><div class="notice">No stories published yet. Each story will carry author and source information, a publication date and links to the places it discusses.</div></section>`},
knowledge(){return `<section class="sec"><div class="eyebrow">Knowledge</div><h2>A structured reference</h2><div class="list">${['Geography','History','Culture and heritage','Environment','Conservation','Communities','Regions of Rwanda'].map((t,i)=>`<div class="row" style="display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px 0;border-top:1px solid var(--line)"><span class="n">0${i+1}</span><h3>${t}</h3><span class="unv">No articles published yet</span></div>`).join('')}</div></section>`},
plan(){return `<section class="sec"><div class="eyebrow">Plan a Visit</div><h2>Before you go</h2><div class="notice">Visa rules, fees, opening hours and safety advice change. None are stated here. Confirm each with the relevant official Rwandan authority or the provider directly.</div>${['Getting around Rwanda','Transport considerations','Travel preparation','Visitor guidance','Responsible travel','Regional planning','Useful contacts and official links'].map(t=>`<div class="dsec"><h2>${t}</h2><span class="unv">${U}</span></div>`).join('')}<p class="sub">Booking happens on official provider websites or by contacting providers directly.</p></section>`},
about(){return `<section class="sec"><div class="eyebrow">About</div><h2>An independent reference</h2><p style="max-width:60ch">Rwanda Atlas helps Rwandans and visitors understand, discover and plan. It is not a tour operator, hotel marketplace or tourism authority, and it does not take bookings. Facts are published only with sources and a verification date.</p><p><a href="#editor">Editorial workspace →</a></p></section>`},
editor(){return `<section class="sec"><div class="eyebrow">Editorial workspace</div><h2>Records & workflow</h2><p class="sub">Demo only: edits live in this browser session. A real deployment needs authentication and a database.</p>
<form class="ed" id="nf"><input name="n" placeholder="Destination name" required aria-label="Name"><select name="r" aria-label="Region">${REG.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select><select name="t" aria-label="Category">${TYPES.map(t=>`<option>${t}</option>`).join('')}</select><button>Add as draft</button></form>
<div class="list">${DEST.map(d=>`<div class="row" style="display:grid;grid-template-columns:1fr auto;gap:14px;padding:14px 0;border-top:1px solid var(--line)"><div><b>${esc(d.name)}</b> <span class="st">${d.status}</span><br><span class="unv">${d.sources.length} source(s)${d.verified?' · verified '+esc(d.verified):''}</span></div><button class="g" data-adv="${d.id}" ${d.status==='Published'?'disabled':''}>Advance</button></div>`).join('')}</div></section>`}
};
function dest(id){
 const d=DEST.find(x=>x.id===id);
 if(!d)return '<section class="sec"><h2>Not found</h2><a href="#explore">Back to Explore</a></section>';
 const unpub=d.status!=='Published';
 return `<div class="crumb"><a href="#home">Home</a> / <a href="#explore">Explore</a> / ${esc(reg(d.region).name)}</div><section class="sec"><div class="eyebrow">${esc(d.type)}</div><h1 style="font-size:clamp(34px,5vw,56px)">${esc(d.name)}</h1>
${unpub?`<div class="notice">Preview: this record is “${d.status}” and not public.</div>`:''}
<div class="plate">${contours(d.name.length,230,170,0)}<span>Photograph pending · image rights under editorial review</span></div>
${d.stub?'<div class="notice">Stub profile. Only the name, region and category are set. Everything else awaits sourced, verified content.</div>':''}
<div class="dgrid"><aside><b>Region</b><br>${esc(reg(d.region).name)}<br><br><b>Coordinates</b><br>${d.coords?d.coords.join(', '):U}<br><br><b>Last verified</b><br>${esc(d.verified)||U}</aside>
<div>${SECTIONS.map(t=>`<div class="dsec"><h2>${t}</h2><span class="unv">${U}</span></div>`).join('')}
<div class="dsec"><h2>Sources</h2>${d.sources.length?d.sources.map(s=>'<div>'+esc(s)+'</div>').join(''):`<span class="unv">No sources attached</span>`}</div></div></div></section>`;
}
function render(){
 const h=(location.hash||'#home').slice(1);
 const k=h.startsWith('d-')?'explore':h;
 $('#nav').innerHTML=NAV.map(([i,l])=>`<a href="#${i}" class="${k===i?'on':''}">${l}</a>`).join('');
 $('#app').innerHTML=h.startsWith('d-')?dest(h.slice(2)):(V[h]||V.home)();
 document.title=(h.startsWith('d-')?(DEST.find(x=>x.id===h.slice(2))||{name:'Not found'}).name+' · ':'')+'Rwanda Atlas';
 window.scrollTo(0,0);
 const fr=$('#fr'),ft=$('#ft');
 if(fr)fr.onchange=e=>{S.r=e.target.value;render()};
 if(ft)ft.onchange=e=>{S.t=e.target.value;render()};
 document.querySelectorAll('[data-r]').forEach(a=>a.onclick=()=>{S.r=a.dataset.r;S.q='';$('#q').value=''});
 document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>advance(b.dataset.adv));
 const nf=$('#nf');
 if(nf)nf.onsubmit=e=>{e.preventDefault();const f=new FormData(nf),n=f.get('n').trim();
  if(!n)return;DEST.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'new-'+DEST.length,name:n,region:f.get('r'),type:f.get('t'),status:'Draft',stub:true,sources:[],verified:''});render()};
}
function advance(id){
 const d=DEST.find(x=>x.id===id),i=STAGES.indexOf(d.status);
 if(STAGES[i+1]==='Published'){
  const s=prompt('Publishing requires a source (citation or URL):');if(!s)return;
  const v=prompt('Verification date (YYYY-MM-DD):');if(!v||!/^\d{4}-\d{2}-\d{2}$/.test(v))return alert('A valid verification date is required.');
  d.sources.push(s);d.verified=v;
 }
 d.status=STAGES[i+1];render();
}
