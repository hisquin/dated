<body>
<header><div class="wrap"><a class="logo" href="#home">ARKON<b>/</b>SCHOOL</a>
<nav aria-label="Main"><a href="#cohorts">Cohorts</a><a href="#courses">Courses</a><a href="#about">About</a><a href="#contact">Contact</a><a href="#auth-signin">Sign in</a><a class="cta" href="#apply">Apply</a></nav></div></header>

<main id="app" class="wrap" tabindex="-1" aria-live="polite"></main>
<footer><div class="wrap">ARKON SCHOOL · a product of ArkonMade · Kigali, Rwanda · <a href="#staff">Staff</a></div></footer>
<script>
// ---- EDIT HERE: confirmed business facts only. Empty = shown as "To be confirmed". ----
const DEFAULT_COURSES=[
{id:"product-design",title:"Product Design (UI/UX)",cat:"Design",summary:"Learn to research, design and test digital products people can actually use.",duration:"",format:"",price:"",prereq:"",
 learn:["User experience and interface design","Product thinking and discovery","User research","Wireframing and prototyping","Design systems","Usability testing"],tools:[],projects:["A portfolio of real product work, reviewed through mentor feedback"]},
{id:"product-development",title:"Product Development",cat:"Engineering",summary:"Build, test and ship working digital products, from frontend to AI integration.",duration:"",format:"",price:"",prereq:"",
 learn:["Software engineering: frontend and backend","No-code and low-code development","AI implementation and integration","Testing and deployment"],tools:[],projects:["Functional digital products you can demonstrate"]}];
const ST={open:"Open for registration",soon:"Coming soon",full:"Fully booked",closed:"Closed"};
const DEMO_DETAIL={"product-design":{duration:"12 weeks",format:"Hybrid · Kigali + online",price:"RWF 450,000",prereq:"No design experience needed. Bring a laptop.",tools:["Figma","FigJam","Maze"],projects:["Redesign a live product","A usability-tested prototype","A portfolio case study"],pick:"You like understanding people and shaping how a product feels."},
"product-development":{duration:"16 weeks",format:"On-site · Kigali",price:"RWF 600,000",prereq:"Basic computer skills. Logic matters more than prior code.",tools:["JavaScript","Postgres","Git","AI APIs"],projects:["A full-stack web app","An AI-powered feature","A deployed product"],pick:"You like building things and watching them work."}};
const DEMO=[{id:"pd-c03",courseId:"product-design",name:"Design · Cohort 03",start:"2026-12-07",deadline:"2026-11-30",schedule:"Mon & Wed, 6–8pm",duration:"12 weeks",format:"Hybrid",status:"open"},
{id:"pdv-c02",courseId:"product-development",name:"Development · Cohort 02",start:"2026-12-14",deadline:"2026-12-05",schedule:"Tue & Thu, 6–8:30pm",duration:"16 weeks",format:"On-site",status:"open"},
{id:"pd-c04",courseId:"product-design",name:"Design · Cohort 04",start:"2027-02-02",schedule:"Tue & Thu, 6–8pm",duration:"12 weeks",format:"Online",status:"soon"},
{id:"pdv-c01",courseId:"product-development",name:"Development · Cohort 01",start:"2026-11-23",schedule:"Mon–Fri mornings",duration:"16 weeks",format:"On-site",status:"full"},
{id:"pd-c02",courseId:"product-design",name:"Design · Cohort 02",start:"2026-09-07",schedule:"Mon & Wed, 6–8pm",duration:"12 weeks",format:"Hybrid",status:"closed"}];
const S={dbc:new Map(),real:[],apps:[],enq:[],db:null,admin:false,uid:null,fc:"All",demo:true};
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tbc=v=>v?esc(v):'<span style="color:var(--mut)">To be confirmed</span>';
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const fd=d=>{if(!d)return null;const x=new Date(d+"T00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const isDemo=()=>!S.real.length&&S.demo;
const ALLC=()=>{const m=new Map(DEFAULT_COURSES.map(c=>[c.id,{...c,...(isDemo()?DEMO_DETAIL[c.id]:{})}]));S.dbc.forEach((v,k)=>m.set(k,v));return[...m.values()]};
const COURSES=()=>ALLC().filter(c=>!c.hidden),COH=()=>S.real.length?S.real:(S.demo?DEMO:[]);
const course=id=>ALLC().find(c=>c.id===id);
const rank={open:0,soon:1,full:2,closed:3};
const sorted=(l=COH())=>l.slice().sort((a,b)=>(rank[a.status]-rank[b.status])||String(a.start||"9").localeCompare(String(b.start||"9")));
const badge=s=>`<span class="status s-${s}">${ST[s]||s}</span>`;
const dots='<circle cx="14" cy="13" r="4" fill="var(--acc)"/><circle cx="28" cy="13" r="4" fill="var(--mut)"/>';
const mock=k=>k==="dev"?`<svg class="mock" viewBox="0 0 320 210" role="img" aria-label="Code editor preview"><rect width="320" height="26" fill="var(--soft)"/>${dots}<g font-family="JetBrains Mono,monospace" font-size="12" fill="var(--ink)"><text x="20" y="54" fill="var(--acc)">const</text><text x="66" y="54">app = build(idea)</text><text x="20" y="76" fill="var(--mut)">// test, then ship</text><text x="20" y="98">await test(app)</text><text x="20" y="120" fill="var(--acc)">deploy</text><text x="72" y="120">(app)</text></g><rect y="170" width="320" height="40" fill="var(--ink)"/><text x="20" y="195" font-size="12" font-family="JetBrains Mono,monospace" fill="var(--bg)">✓ deployed · 0 errors</text></svg>`
:`<svg class="mock" viewBox="0 0 320 210" role="img" aria-label="Interface design preview"><rect width="320" height="26" fill="var(--soft)"/>${dots}<rect x="20" y="42" width="120" height="14" fill="var(--ink)"/><rect x="20" y="64" width="190" height="7" fill="var(--mut)" opacity=".5"/><rect x="20" y="78" width="160" height="7" fill="var(--mut)" opacity=".5"/><rect x="20" y="100" width="70" height="24" fill="var(--acc)"/>${[20,117,214].map(x=>`<rect x="${x}" y="144" width="86" height="50" fill="var(--soft)" stroke="var(--ink)"/>`).join("")}<path d="M230 108v22l6-6 5 11 4-2-5-10h8z" fill="var(--ink)"/></svg>`;
const kind=c=>c?.id==="product-development"?"dev":"design";

async function init(){
 try{const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);S.db=db;
  if(user){S.admin=await user.canEdit();S.uid=await user.id()}}catch(e){}
 if(S.db){const sub=(p,fn)=>{try{S.db.collection(p).onSnapshot(sn=>{fn(sn.docs.map(d=>({id:d.id,...d.data()})));route()},()=>{})}catch(e){}};
  const fl=r=>r.flatMap(x=>(x.items||[]).map(i=>({...i,_d:x.id}))).sort((a,b)=>(b.at||0)-(a.at||0));
  sub("courses",r=>S.dbc=new Map(r.map(x=>[x.id,x])));sub("cohorts",r=>S.real=r);
  if(S.admin){sub("applications",r=>S.apps=fl(r));sub("enquiries",r=>S.enq=fl(r))}}
 route();
}
// Saves only if the write is confirmed by reading it back. Never overwrites an existing entry.
async function save(coll,id,data){
 if(isDemo())throw new Error("demo");
 if(!(S.db&&S.uid))throw new Error("offline");
 const ref=S.db.doc(coll+"/"+S.uid);let items=[];
 try{items=(await ref.get()).data()?.items||[]}catch(e){}
 if(items.some(i=>i.id===id))throw new Error("dup");
 await ref.set({uid:S.uid,items:[...items,{...data,id,at:Date.now()}]});
 if(!((await ref.get()).data()?.items||[]).some(i=>i.id===id))throw new Error("verify");
}
const MSG={demo:"These cohorts are sample data, so nothing was saved. Real applications open once real cohorts are published.",
 offline:"Online applications aren't connected for visitors yet, so nothing was submitted. "+"Please contact the school directly.",
 dup:"You have already applied to this cohort with this email. We have your application.",verify:"We couldn't confirm your submission was saved. Please try again."};
const errMsg=e=>MSG[e.message]||"Something went wrong and nothing was submitted. Please try again.";

function rows(list){
 if(!list.length)return`<p class="note">No cohorts are published yet. <a href="#contact">Ask us</a> when the next one starts.</p>`;
 return`<div class="ledger" role="list">`+list.map(c=>{const co=course(c.courseId);return`<a class="row" role="listitem" href="#cohort-${esc(c.id)}">
 <div><span class="mono">${esc(c.name||c.id)}</span><small>${esc(co?.title||"")}</small></div>
 <div><strong>${c.start?esc(fd(c.start)):"Start date TBC"}</strong><small>${esc(c.schedule||"Schedule TBC")}</small></div>
 <div>${esc([c.format,c.duration].filter(Boolean).join(" · ")||"—")}<small>${esc(co?.price||"")}</small></div>
 <div>${badge(c.status)}${c.status==="open"&&c.deadline?`<small>Apply by ${esc(fd(c.deadline))}</small>`:""}</div><div class="arrow" aria-hidden="true">→</div></a>`}).join("")+`</div>`}
const list=a=>a?.length?`<ul class="plain">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<p style="color:var(--mut)">To be confirmed</p>';
const nextOpen=id=>sorted(COH().filter(c=>c.courseId===id&&c.status==="open"))[0];
const notify=(label,type,ref)=>`<form id="n" data-t="${type}" data-r="${esc(ref)}" novalidate><label>${label}<input name="email" type="email" autocomplete="email" inputmode="email" required><span class="err" data-e="email"></span></label><button class="btn" type="submit">Notify me</button><div class="err" role="alert"></div></form>`;

const views={
home(){const op=sorted().filter(c=>c.status==="open"||c.status==="soon").slice(0,3);
