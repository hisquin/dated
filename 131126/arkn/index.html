// ---- EDIT HERE: confirmed business facts only. Empty = shown as "To be confirmed". ----
const DEFAULT_COURSES=[
{id:"product-design",title:"Product Design (UI/UX)",cat:"Design",summary:"Learn to research, design and test digital products people can actually use.",duration:"",format:"",price:"",prereq:"",
 learn:["User experience and interface design","Product thinking and discovery","User research","Wireframing and prototyping","Design systems","Usability testing"],tools:[],projects:["A portfolio of real product work, reviewed through mentor feedback"]},

 learn:["Software engineering: frontend and backend","No-code and low-code development","AI implementation and integration","Testing and deployment"],tools:[],projects:["Functional digital products you can demonstrate"]}];

{id:"pdv-c02",cap:25,taken:9,courseId:"product-development",name:"Development · Cohort 02",start:"2026-12-14",deadline:"2026-12-05",schedule:"Tue & Thu, 6–8:30pm",duration:"16 weeks",format:"On-site",status:"open"},
{id:"pd-c04",cap:30,taken:0,courseId:"product-design",name:"Design · Cohort 04",start:"2027-02-02",schedule:"Tue & Thu, 6–8pm",duration:"12 weeks",format:"Online",status:"soon"},
{id:"pdv-c01",cap:20,taken:20,courseId:"product-development",name:"Development · Cohort 01",start:"2026-11-23",schedule:"Mon–Fri mornings",duration:"16 weeks",format:"On-site",status:"full"},
{id:"pd-c02",cap:30,taken:30,courseId:"product-design",name:"Design · Cohort 02",start:"2026-09-07",schedule:"Mon & Wed, 6–8pm",duration:"12 weeks",format:"Hybrid",status:"closed"}];
const S={dbc:new Map(),real:[],apps:[],enq:[],db:null,admin:false,uid:null,fc:"All",demo:true};
const $=s=>document.querySelector(s),app=$("#app");
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tbc=v=>v?esc(v):'<span style="color:var(--mut)">To be confirmed</span>';
const slug=t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
const fd=d=>{if(!d)return null;const x=new Date(d+"T00:00");return isNaN(x)?d:x.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})};
const isDemo=()=>!S.real.length&&S.demo;
const ALLC=()=>{const m=new Map(DEFAULT_COURSES.map(c=>[c.id,{...c,...(isDemo()?DEMO_DETAIL[c.id]:{})}]));S.dbc.forEach((v,k)=>m.set(k,v));return[...m.values()]};
const COURSES=()=>ALLC().filter(c=>!c.hidden),COH=()=>S.real.length?S.real:(S.demo?DEMO:[]);
const course=id=>ALLC().find(c=>c.id===id);
const rank={open:0,soon:1,full:2,closed:3};
const sorted=(l=COH())=>l.slice().sort((a,b)=>(rank[a.status]-rank[b.status])||String(a.start||"9").localeCompare(String(b.start||"9")));

:`<svg class="mock" viewBox="0 0 320 210" role="img" aria-label="Interface design preview"><rect width="320" height="26" fill="var(--soft)"/>${dots}<rect x="20" y="42" width="120" height="14" fill="var(--ink)"/><rect x="20" y="64" width="190" height="7" fill="var(--mut)" opacity=".5"/><rect x="20" y="78" width="160" height="7" fill="var(--mut)" opacity=".5"/><rect x="20" y="100" width="70" height="24" fill="var(--acc)"/>${[20,117,214].map(x=>`<rect x="${x}" y="144" width="86" height="50" fill="var(--soft)" stroke="var(--ink)"/>`).join("")}<path d="M230 108v22l6-6 5 11 4-2-5-10h8z" fill="var(--ink)"/></svg>`;
const kind=c=>c?.id==="product-development"?"dev":"design";

async function init(){
 try{const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);S.db=db;
  if(user){S.admin=await user.canEdit();S.uid=await user.id()}}catch(e){}
 if(S.db){const sub=(p,fn)=>{try{S.db.collection(p).onSnapshot(sn=>{fn(sn.docs.map(d=>({id:d.id,...d.data()})));route()},()=>{})}catch(e){}};
  const fl=r=>r.flatMap(x=>(x.items||[]).map(i=>({...i,_d:x.id}))).sort((a,b)=>(b.at||0)-(a.at||0));
  sub("courses",r=>S.dbc=new Map(r.map(x=>[x.id,x])));sub("cohorts",r=>S.real=r);
  if(S.admin){sub("applications",r=>S.apps=fl(r));sub("enquiries",r=>S.enq=fl(r))}}
 route();
}
// Saves only if the write is confirmed by reading it back. Never overwrites an existing entry.
async function save(coll,id,data){
 if(isDemo())throw new Error("demo");
 if(!(S.db&&S.uid))throw new Error("offline");
 const ref=S.db.doc(coll+"/"+S.uid);let items=[];
 try{items=(await ref.get()).data()?.items||[]}catch(e){}
 if(items.some(i=>i.id===id))throw new Error("dup");
 await ref.set({uid:S.uid,items:[...items,{...data,id,at:Date.now()}]});
 if(!((await ref.get()).data()?.items||[]).some(i=>i.id===id))throw new Error("verify");
}

function route(){const h=location.hash.slice(1)||"home",[p,qs]=h.split("?"),q=new URLSearchParams(qs||"");let v=p,arg;

 mode.innerHTML=S.demo?'Sample data — dates, prices and cohorts are placeholders. <a href="#" data-demo="0">Preview empty state</a>':'Empty-state preview. <a href="#" data-demo="1">Show sample data</a>';

  await save("enquiries",slug(d.email)+"-"+Date.now(),{...d,type:"enquiry"});f.outerHTML=`<p class="note" role="status">Message sent. We will reply by email.</p>`;return}

  await save("enquiries",slug(d.email+"-"+f.dataset.t+"-"+f.dataset.r),{email:d.email,name:d.email,type:"notify-"+f.dataset.t,ref:f.dataset.r});f.outerHTML=`<p role="status"><strong>✓ Saved.</strong> We will email you.</p>`;return}
 if(f.id==="ac"){const d=val();if(!d.title.trim())return;const id=d.cid||slug(d.title),old=course(id)||{};
  await S.db.doc("courses/"+id).set({...old,id,title:d.title,cat:d.cat,summary:d.summary,duration:d.duration,format:d.format,price:d.price,prereq:d.prereq,learn:lines(d.learn),tools:lines(d.tools),projects:lines(d.projects)});f.reset();$("#ace").textContent="Saved."}

{title:"Motivation",head:"Motivation and readiness",fields:[A("why","Why do you want to join ARKON SCHOOL?",{type:"textarea",req:1,min:30}),A("build","What do you hope to build or achieve?",{type:"textarea",req:1,min:20,rows:3}),A("avail","Weekly availability",{type:"select",req:1,opts:["Under 5 hours","5–10 hours","10–20 hours","20+ hours"]}),A("equip","Do you have a laptop or computer?",{type:"radio",req:1,rerender:1,opts:["Yes, my own","Shared or borrowed","Not yet"]}),A("equipNote","What would help?",{type:"textarea",rows:2,when:v=>v.equip==="Not yet"}),A("extra","Anything else we should know?",{type:"textarea",rows:3})]},
{title:"Portfolio",head:"Portfolio and work (optional)",fields:[
 {type:"note",text:v=>lvl(v)==="Beginner"?"New to this? Skip ahead. We care more about your motivation than a portfolio.":"Share what you have. Everything on this step is optional.",when:()=>true},
 A("portfolio","Portfolio link",{type:"url",when:v=>v.track!=="product-development"}),A("github","GitHub profile",{type:"url",when:v=>v.track==="product-development"}),A("links","Other projects or work samples",{type:"textarea",rows:3,help:"Links, one per line."}),
 {type:"note",text:()=>"File uploads aren't available yet. They need backend storage.",when:()=>true}]},
{title:"Review",head:"Review and submit",review:v=>applyCfg.steps.slice(0,-1).map((s,i)=>`<section class="ps"><div class="head"><h3>${esc(s.title)}</h3><button type="button" class="btn alt sm" data-wz="goto" data-i="${i}">Edit</button></div><dl>${(i===0?[{n:"track",l:"Programme"},{n:"cohort",l:"Cohort"}]:[]).concat(Wiz.vis(applyCfg,i,v).filter(f=>f.n)).filter(f=>v[f.n]).map(f=>{const raw=String(v[f.n]),sh=f.n==="track"?course(raw)?.title:f.n==="cohort"?cohortOf(v)?.name:raw;return`<dt>${esc(f.l)}</dt><dd>${esc(sh||raw)}</dd>`}).join("")||"<dt>—</dt><dd>Nothing added</dd>"}</dl></section>`).join(""),
 fields:[A("consent","I confirm the information above is accurate.",{type:"checkbox",req:1,msg:"Please confirm before submitting"})]}],
onChange:(n,st)=>{if(n==="track"&&!openFor(st.v).some(c=>c.id===st.v.cohort))st.v.cohort=""},
errMsg:x=>x.message==="elig"?x.m:x.message==="offline"?"Online applications aren't connected for visitors yet, so nothing was submitted. Your answers are saved on this device, so you won't lose them. Please contact the school directly.":x.message==="dup"?"You have already applied to this cohort with this email. Your original application was not changed.":x.message==="verify"?"We couldn't confirm your application was saved. Please try again.":"Something went wrong and nothing was submitted. Please try again.",
submit:async v=>{const er=elig(v.cohort);if(er)throw Object.assign(new Error("elig"),{m:er});const c=cohortOf(v),r=()=>Date.now().toString(36).toUpperCase().slice(-5)+Math.random().toString(36).slice(2,5).toUpperCase();
 const{consent,...rest}=v,rec={...rest,format:v.format||c.format||"",ref:"ARK-"+r(),status:"Submitted"};
 if(isDemo())return{saved:false,ref:"PREVIEW-"+r(),c,v};
 await save("applications",slug(v.email+"-"+v.cohort),rec);return{saved:true,ref:rec.ref,c,v}},
done:r=>`<div role="status"><p class="mono" style="color:${r.saved?"var(--ok)":"var(--acc)"}">${r.saved?"✓ Application received":"Preview only — nothing was saved"}</p><h2 class="wz-h" style="margin-top:8px"><span class="redline">${r.saved?"Thank you, "+esc((r.v.name||"").split(" ")[0]):"This is how confirmation looks"}</span></h2>${r.saved?"":`<p class="note">These cohorts are sample data and no backend is connected, so this application was not stored or sent.</p>`}<p>Reference <strong class="mono">${esc(r.ref)}</strong><br>${esc(r.c.name)} · ${esc(course(r.c.courseId)?.title||"")}</p><h3>What happens next</h3><ol class="steps3"><li>We review your application.</li><li>We may invite you to a short interview.</li><li>You get a decision: accepted, waitlisted or declined.</li><li>If accepted, you confirm your place to enrol. Acceptance is not enrolment.</li></ol><p><a class="btn" href="#cohorts">Back to cohorts</a></p></div>`};
views.apply=()=>COH().some(c=>!elig(c.id))?`<section><h1 class="h1s">Apply</h1><p class="lede" style="margin-top:0">About five minutes. Your progress is saved on this device.</p><div id="wz"></div></section>`:`<section><h1 class="h1s">Apply</h1><p class="note">No cohort is open for applications right now. <a href="#cohorts">See upcoming cohorts</a> or <a href="#contact">ask us</a>.</p></section>`;
wireApply=function(){if(!document.querySelector("#wz"))return;const q=new URLSearchParams(location.hash.split("?")[1]||""),ch=q.get("cohort"),tr=q.get("track")||q.get("course"),init={};let msg="";
 if(ch){const c=COH().find(x=>x.id===ch),er=elig(ch);if(c&&!er){init.cohort=ch;init.track=c.courseId}else{msg=(er||"That cohort could not be found.")+" Choose another below.";if(c)init.track=c.courseId}}else if(tr&&COURSES().some(c=>c.id===tr))init.track=tr;
 Wiz.mount(applyCfg,init);if(msg){Wiz.cur.st.msg=msg;Wiz.draw()}};
</script>
</body></html>
