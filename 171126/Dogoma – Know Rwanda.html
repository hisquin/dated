<script>
const $=s=>document.querySelector(s),arr=Array.isArray,esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

const CFG={max:{easy:80,medium:100,hard:120},minRatio:.2,qTime:{easy:20,medium:25,hard:30},fb:{count:8,time:3},counts:[5,10,15,20],durations:[60,120,180,300]};

const txtOk=q=>typeof q.correct_answer==='string'&&q.correct_answer.trim()?null:'correct_answer required';
const osa=(a,b)=>{const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]!==b[j-1]));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]};

function fuzzy(q,a){const v={normalization:true,allow_minor_typos:true,case_sensitive:false,...q.validation},C=[q.correct_answer,...(q.accepted_answers||[]),...(q.accepted||[])];if(v.case_sensitive)return C.some(c=>String(c).trim()===String(a).trim());const f=s=>v.normalization?norm(s):String(s).trim().toLowerCase(),x=f(a);if(!x)return false;
 return C.some(c=>{const y=f(c);if(x===y)return true;if(!v.allow_minor_typos||/\d/.test(y))return false;const L=y.length,k=L<=4?0:L<=8?1:2;return k>0&&Math.abs(x.length-L)<=k&&osa(x,y)<=k})}
const same=q=>q.correct_answer,TXT={v:txtOk,r:typed,c:fuzzy,s:same};
const H={
 multiple_choice:{v:q=>arr(q.options)&&q.options.length>=2&&q.options.includes(q.correct_answer)?null:'options must include correct_answer',r:(q,b,d)=>choice(q.options,b,d),c:(q,a)=>a===q.correct_answer,s:same},

  r:(q,b,d)=>{const p=[];b.innerHTML='<p class="mu">Tap in order, earliest first.</p>';shuf(q.options).forEach(o=>{const x=document.createElement('button');x.className='opt';x.textContent=o;x.onclick=()=>{p.push(o);x.disabled=true;x.textContent=p.length+'. '+o;if(p.length===q.options.length)d(p)};b.append(x)});const r=document.createElement('button');r.className='lnk';r.textContent='Start over';r.onclick=()=>{p.length=0;b.querySelectorAll('.opt').forEach(x=>{x.disabled=false;x.textContent=x.textContent.replace(/^\d+\. /,'')})};b.append(r);CUR.get=()=>p},

};

const ACTIVE=['RW'],S={view:'home',cat:'all',mode:'count',n:15,dur:120,sess:null},CUR={get:()=>null}; /* ACTIVE = internal content scope, not a player choice */

/* pure scoring: linear from max (instant) to min (at deadline); late or wrong = 0 */
const qLimit=q=>CFG.qTime[q.difficulty]*1e3;
function scoreFor(q,ms){const T=qLimit(q);ms=Math.max(0,ms);if(ms>T)return 0;const mx=CFG.max[q.difficulty],mn=Math.round(mx*CFG.minRatio);return Math.round(mn+(mx-mn)*(T-ms)/T)}
let TK=null;const stop=()=>{clearInterval(TK);TK=null},fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1e3));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function go(v){stop();if(v!=='game'&&v!=='result'&&S.sess&&S.sess.phase!=='done')S.sess.phase='done';S.view=v;({home,game,result,editor})[v]();scrollTo(0,0)}
function home(){const all=pool('all'),cats=[...new Set(all.map(q=>q.category))],p=pool(),t=S.mode==='time',g=G.d.games,best=g.reduce((m,x)=>Math.max(m,x.score),0);
 const chips=(a,cur,it)=>it.map(([v,l])=>`<button class="chip" data-a="${a}" data-v="${esc(v)}" aria-pressed="${cur==v}">${esc(l)}</button>`).join('');
 app.innerHTML=`<section class="hero"><p class="kick">DOGOMA / ${esc(REG.find(r=>r.key===ACTIVE[0]).label)}</p><h1>Know where you come from.</h1><p class="mu">Faster correct answers earn more points. No account needed.</p></section>
 <div class="grp"><p>What do you want to test your knowledge on?</p>${chips('cat',S.cat,[['all','Mixed knowledge ('+all.length+')'],...cats.map(c=>[c,cap(c)+' ('+pool(c).length+')'])])}</div>
 <div class="grp"><p>How do you want to play?</p>${chips('mode',S.mode,[['count','Set number of questions'],['time','Against the clock']])}</div>
 <div class="grp"><p>${t?'Time limit':'Number of questions'}</p>${t?chips('dur',S.dur,CFG.durations.map(d=>[d,d/60+(d===60?' minute':' minutes')])):chips('n',S.n,CFG.counts.map(c=>[c,c]))}</div>
 <div class="row"><button class="btn" data-a="start" ${p.length?'':'disabled'}>Start game</button><span class="mu">${!p.length?'No published questions for this topic. Pick another topic.':t?'Answer as many as you can. Each question has its own time limit.':p.length<S.n?`Only ${p.length} questions available, so this game will have ${p.length}.`:''}</span></div>
 <div class="stats"><span><b>${g.length}</b>games played</span><span><b>${best}</b>best score</span><span><b>${G.d.xp}</b>total points</span></div>`}
function start(){const p=pool();if(!p.length)return home();const n=Date.now(),t=S.mode==='time';S.sess={mode:S.mode,qs:shuf(p).slice(0,t?p.length:S.n),i:-1,score:0,log:[],phase:'',t0:n,end:t?n+S.dur*1e3:0};go('game')}
function game(){const s=S.sess;app.innerHTML=`<div class="bar"><span id="pg"></span><span id="sc" class="num"></span><span id="ck" class="num"></span><button class="lnk" data-a="quit">Quit</button></div><div class="prog"><i id="pb"></i></div><div id="qa"></div>`;TK=setInterval(tick,200);next(true)}
function next(first){const s=S.sess;if(!s||s.phase==='done'||(!first&&s.phase!=='feedback'))return;if(s.end&&Date.now()>=s.end)return finish();s.i++;if(s.i>=s.qs.length)return finish();
 const q=s.qs[s.i],n=Date.now();s.q=q;s.phase='ask';s.qs0=n;s.qdl=n+qLimit(q);CUR.get=()=>null;
 $('#qa').innerHTML=`<article><p class="kick">${esc(cap(q.category))}, ${esc(q.difficulty)}</p><div class="qt"><span id="qt" class="num"></span><div class="tbar"><i id="tb2"></i></div></div><h2>${esc(q.question)}</h2><div id="ans"></div><div id="fb" aria-live="polite"></div></article>`;
 H[q.question_type].r(q,$('#ans'),a=>resolve(a));hud()}
function hud(){const s=S.sess,n=Date.now(),t=s.mode==='time';$('#pg').textContent=t?'Question '+(s.log.length+(s.phase==='ask'?1:0)):'Question '+(s.i+1)+' of '+s.qs.length;$('#sc').textContent=s.score+' pts';$('#ck').textContent=t?fmt(s.end-n)+' left':'';
 $('#pb').style.width=Math.min(100,(t?(n-s.t0)/(s.end-s.t0):s.log.length/s.qs.length)*100)+'%';
 if(s.phase==='ask'){const r=Math.max(0,s.qdl-n);$('#qt').textContent=Math.ceil(r/1e3)+'s';$('#tb2').style.width=r/qLimit(s.q)*100+'%'}else if(s.phase==='feedback'&&$('#ft'))$('#ft').textContent=Math.ceil(Math.max(0,s.fbEnd-n)/1e3)}
/* one ticker drives all three clocks from real timestamps: session end, question deadline, feedback end */
function tick(){const s=S.sess;if(!s||s.phase==='done')return;const n=Date.now();if(s.end&&n>=s.end)return finish();
 if(s.phase==='ask'&&n>=s.qdl)resolve(CUR.get(),true);else if(s.phase==='feedback'&&n>=s.fbEnd)next();
 if(s.phase!=='done')hud()}
function resolve(a,auto){const s=S.sess;if(!s||s.phase!=='ask')return;const n=Date.now();if(s.end&&n>=s.end)return finish();
 const q=s.q,h=H[q.question_type],late=!auto&&n>s.qdl,blank=late||a==null||a===''||(arr(a)&&a.every(x=>!x))||(typeof a==='string'&&!a.trim()),ok=!blank&&!!h.c(q,a),ms=Math.min(n-s.qs0,qLimit(q)),pts=ok?scoreFor(q,ms):0;
 s.phase='feedback';s.score+=pts;s.log.push({id:q.id,res:blank?'none':ok?'ok':'bad',pts,ms});s.fbEnd=n+CFG.fb[s.mode]*1e3;
 document.querySelectorAll('#ans .opt').forEach(b=>{if(b.textContent===q.correct_answer)b.classList.add('ok');else if(b.textContent===a)b.classList.add('bad')});
 $('#ans').querySelectorAll('input,select,button').forEach(x=>x.disabled=true);
 const last=!s.end&&s.i+1>=s.qs.length;
 $('#fb').innerHTML=`<div class="fb ${ok?'good':'miss'}"><b>${ok?'Correct, +'+pts+' points':blank?'Time’s up, no answer':'Not quite'}</b>${ok?'':`<p>Answer: ${esc(h.s(q))}</p>`}<p>${esc(q.explanation)}</p><small>Sources: ${q.source_ids.map(i=>esc(SRC[i]||i)).join('; ')}</small><div class="row"><button class="btn" data-a="next">${last?'See results':'Next question'}</button><span class="mu">${last?'Results':'Next question'} in <b id="ft" class="num"></b>s</span></div></div>`;hud();const b=$('#fb .btn');if(b)b.focus()}
function finish(){const s=S.sess;if(!s||s.phase==='done')return;s.phase='done';stop();s.t1=Math.min(Date.now(),s.end||Infinity);const L=s.log;G.d.games.push({t:Date.now(),mode:s.mode,score:s.score,ok:L.filter(x=>x.res==='ok').length,n:L.length});G.d.games=G.d.games.slice(-50);G.d.xp+=s.score;G.save();go('result')}
function result(){const s=S.sess;if(!s)return go('home');const L=s.log,A=L.length,c=L.filter(x=>x.res==='ok'),w=L.filter(x=>x.res==='bad').length,u=L.filter(x=>x.res==='none').length,an=L.filter(x=>x.res!=='none'),
 avg=an.length?an.reduce((a,x)=>a+x.ms,0)/an.length/1e3:0,fast=c.length?Math.min(...c.map(x=>x.ms))/1e3:0,mins=Math.max(1e3,s.t1-s.t0)/6e4,t=s.mode==='time',prev=G.d.games.slice(0,-1).filter(g=>g.mode===s.mode).reduce((m,x)=>Math.max(m,x.score),0),
 st=(v,l)=>`<div><b class="num">${v}</b><small>${l}</small></div>`;
 app.innerHTML=`<section class="hero"><p class="kick">${t?'Against the clock':'Question game'} finished</p><h1><span class="num">${s.score}</span> <small>points</small></h1><p>${s.score>prev?'New personal best for this format.':'Personal best for this format: '+prev+'.'} Wrong or missed questions score zero, so speed only counts when you know the answer.</p></section>
 <h2>Knowledge</h2><div class="sg">${st(A?Math.round(c.length/A*100)+'%':'0%','accuracy')}${st(c.length,'correct')}${st(w,'incorrect')}${st(u,'unanswered')}${st(A,t?'questions attempted':'questions completed')}</div>
 <h2>Speed</h2><div class="sg">${st(avg?avg.toFixed(1)+'s':'–','average answer time')}${st(fast?fast.toFixed(1)+'s':'–','fastest correct answer')}${t?st((A/mins).toFixed(1),'questions per minute'):''}</div>
 <ol class="rev">${L.map(l=>{const q=repo.m.get(l.id);return`<li><span>${l.res==='ok'?'✓':l.res==='bad'?'✕':'–'}</span>${esc(q.question)}<br><small>${esc(H[q.question_type].s(q))}, ${l.res==='none'?'no answer':(l.ms/1e3).toFixed(1)+'s'}, ${l.pts} pts</small></li>`}).join('')}</ol>
 <div class="row"><button class="btn" data-a="start">Play again</button><button class="chip" data-a="quit">Change challenge</button></div>`}

/* content editor: drafts live in this browser; export returns validated JSON */
const msg=t=>{$('#msg').innerHTML=[].concat(t).map(esc).join('<br>')};
function editor(){app.innerHTML=`<section class="hero"><p class="kick">Content</p><h1>Question bank</h1><p class="mu">The seed JSON is the canonical dataset. Changes here are saved as drafts in this browser and exported back to JSON. They are not published to other players.</p></section>
 <div class="row"><input id="sq" type="search" placeholder="Search questions" aria-label="Search questions"><select id="st" aria-label="Filter by status"><option value="">All statuses</option><option>published</option><option>draft</option><option>reviewed</option><option>archived</option></select><button class="chip" data-a="new">New question</button></div><div id="list"></div>
 <h2>Edit as JSON</h2><textarea id="js" rows="14" spellcheck="false" aria-label="Question JSON"></textarea><div class="row"><button class="chip" data-a="val">Validate</button><button class="chip" data-a="prev">Preview</button><button class="btn" data-a="save">Save draft</button></div><div id="msg" role="status"></div><div id="pv"></div>
 <h2>Import and export</h2><textarea id="io" rows="8" spellcheck="false" aria-label="Import or export JSON" placeholder="Paste a JSON array of questions here to import, or export the bank into this box."></textarea><div class="row"><button class="chip" data-a="exp" data-v="all">Export all</button><button class="chip" data-a="exp" data-v="pub">Export published</button><button class="chip" data-a="imp">Import</button><button class="chip" data-a="reset">Discard all drafts</button></div>`;
 $('#sq').oninput=lst;$('#st').onchange=lst;lst()}
function lst(){const t=$('#sq').value.toLowerCase(),st=$('#st').value,a=repo.all().filter(q=>(!st||q.status===st)&&(q.id+' '+q.question).toLowerCase().includes(t));
 $('#list').innerHTML=`<p class="mu">${a.length} of ${repo.m.size} questions</p>`+(a.slice(0,100).map(q=>`<div class="li"><code>${esc(q.id)}</code><span>${esc(q.question)}</span><small>${esc(q.question_type)}, ${esc(q.difficulty)}, ${esc(q.status)}${validate(q).length?', invalid':''}</small><button class="lnk" data-a="edit" data-v="${esc(q.id)}">Edit</button><button class="lnk" data-a="arch" data-v="${esc(q.id)}">Archive</button></div>`).join('')||'<p>No questions match. Clear the search or add a new question.</p>')}
function parse(){try{return JSON.parse($('#js').value)}catch(e){msg('Invalid JSON: '+e.message);return null}}
async function imp(t){let j;try{j=JSON.parse(t)}catch(e){return['Invalid JSON: '+e.message]}const a=arr(j)?j:j&&j.questions;if(!arr(a))return['Expected a JSON array or {"questions": [...]}'];
 const err=[],seen=new Set();a.forEach((q,i)=>{const e=validate(q);if(q&&q.id){if(seen.has(q.id))e.push('duplicate id in file');seen.add(q.id)}e.forEach(m=>err.push(`#${i+1} ${q&&q.id||'?'}: ${m}`))});
 if(err.length)return err;for(const q of a)await repo.put(q);return[]}

const ACT={
 nav:go,theme:()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=d?'light':'dark'},
 cat:v=>{S.cat=v;home()},mode:v=>{S.mode=v;home()},n:v=>{S.n=+v;home()},dur:v=>{S.dur=+v;home()},
 start,quit:()=>go('home'),next:()=>{const s=S.sess;if(s&&s.phase==='feedback')next()},
 new:()=>{$('#js').value=JSON.stringify({id:'RW-HIS-0100',scope:'country',country_codes:['RW'],category:'history',subcategory:'',difficulty:'easy',question_type:'multiple_choice',question:'',options:['','','',''],correct_answer:'',explanation:'',source_ids:['SRC-0001'],status:'draft',version:1},null,2);msg('New question template loaded.')},
 edit:v=>{$('#js').value=JSON.stringify(repo.m.get(v),null,2);msg('Editing '+v);$('#js').scrollIntoView()},
 val:()=>{const q=parse();if(!q)return;const e=validate(q);msg(e.length?e:(repo.m.has(q.id)?'Valid. Saving will update the existing question.':'Valid. Saving will add a new question.'))},
 save:async()=>{const q=parse();if(!q)return;const e=validate(q);if(e.length)return msg(['Not saved:',...e]);const x=repo.m.get(q.id);q.version=x?Math.max(q.version||1,(x.version||1)+1):(q.version||1);await repo.put(q);lst();msg('Saved '+q.id+' (version '+q.version+').')},
 prev:()=>{const q=parse();if(!q)return;const e=validate(q);if(e.length)return msg(['Cannot preview:',...e]);msg('');$('#pv').innerHTML=`<article><h2>${esc(q.question)}</h2><div id="pva"></div><p id="pvf" role="status"></p></article>`;H[q.question_type].r(q,$('#pva'),a=>{$('#pvf').textContent=H[q.question_type].c(q,a)?'Correct.':'Not correct. Answer: '+H[q.question_type].s(q)})},
 arch:async v=>{const q={...repo.m.get(v),status:'archived'};q.version=(q.version||1)+1;await repo.put(q);lst()},
 exp:v=>{$('#io').value=JSON.stringify(repo.all().filter(q=>v==='all'||q.status==='published'),null,2);msg('Exported. Copy this into the matching JSON file in your repository.')},
 imp:async()=>{const e=await imp($('#io').value);if(e.length)msg(['Import rejected. Nothing was changed.',...e]);else{msg('Import complete.');lst()}},
 reset:async()=>{await repo.reset();lst();msg('Drafts discarded. Seed questions restored.')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)ACT[b.dataset.a](b.dataset.v)});
repo.init().then(()=>go('home'));
</script></body></html>
